---
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check core/ plugins/ server/ tests/

      - name: Audit dependencies for known CVEs
        run: uv run pip-audit -r requirements.txt

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Check Go formatting
        working-directory: ./client
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

  test-suite:
    name: Test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run Python tests with coverage
        run: |
          uv run pytest tests/ \
            -n auto \
            --cov=core \
            --cov=plugins \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run Go tests
        working-directory: ./client
        run: go test ./...

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/

      - name: Validate terraform/aws
        working-directory: ./terraform/aws
        run: |
          # Placeholder for the Lambda artifact referenced by filebase64sha256()
          touch lambda-deployment.zip
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate terraform/bootstrap
        working-directory: ./terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
